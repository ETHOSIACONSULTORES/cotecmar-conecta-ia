services:
  - type: web
    name: cotecmar-conecta-ia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cotecmar-conecta-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_AUTO_ANALYZE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "8"

databases:
  - name: cotecmar-conecta-db
    plan: 0.1c-256mb
    databaseName: cotecmar_conecta
    user: cotecmar_conecta
